upstream pwc_production_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperswithcode.co;
    root /srv/paperswithcode/environments/production/current/frontend-dist;

    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/paperswithcode_access.log;
    error_log /var/log/nginx/paperswithcode_error.log;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /assets/ {
        try_files $uri @production_previous_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location @production_previous_asset {
        root /srv/paperswithcode/environments/production/previous/frontend-dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }
    location /api/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /health {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location /thumbnails/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ ^/papers?/[^/]+ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paperswithcode.co;
    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paperswithcode.co$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name paperswithcode.co www.paperswithcode.co 167.235.148.241;
    return 301 https://paperswithcode.co$request_uri;
}
