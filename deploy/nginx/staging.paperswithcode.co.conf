upstream pwc_staging_backend {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.paperswithcode.co;
    root /srv/paperswithcode/environments/staging/current/frontend-dist;

    ssl_certificate /etc/letsencrypt/live/staging.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/staging_paperswithcode_access.log;
    error_log /var/log/nginx/staging_paperswithcode_error.log;
    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /health {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/auth/hf/login {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/auth/hf/callback {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /_admin_check {
        internal;
        proxy_pass http://pwc_staging_backend/api/v1/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include proxy_params;
    }
    location @staging_signin {
        return 302 https://$host/api/v1/auth/hf/login?return_to=$request_uri;
    }
    location @staging_forbidden {
        default_type text/plain;
        return 403 "staging.paperswithcode.co is limited to allowlisted admin accounts.\n";
    }
    location ^~ /assets/ {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files $uri @staging_previous_asset;
        expires 1y;
        add_header Cache-Control "private, immutable";
    }
    location @staging_previous_asset {
        root /srv/paperswithcode/environments/staging/previous/frontend-dist;
        try_files $uri =404;
    }
    location = /index.html {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }
    location /images/ {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        expires 30d;
        add_header Cache-Control "private, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location /api/ {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location /thumbnails/ {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location ~ ^/papers?/[^/]+ {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location / {
        auth_request /_admin_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.paperswithcode.co;
    return 301 https://staging.paperswithcode.co$request_uri;
}
