name: Cron - Update GitHub Stars

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-update-github-stars
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run update_github_stars on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              '/root/python_projects/paperswithcode/.github/workflows/scripts/run_github_stars.sh'
