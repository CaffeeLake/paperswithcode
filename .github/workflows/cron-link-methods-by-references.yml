name: Cron - Link Methods by References

on:
  schedule:
    # Sundays 04:00 UTC (off-peak; well after the daily HF papers import).
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

concurrency:
  group: cron-link-methods-by-references
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run link_methods_by_references on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              '/root/python_projects/paperswithcode/.github/workflows/scripts/run_link_methods_by_references_weekly.sh'
