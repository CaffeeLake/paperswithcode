name: Cron - Calculate Trending Scores

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-calculate-trending-scores
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run calculate_trending_scores on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              '/root/python_projects/paperswithcode/cron/run_trending_scores.sh'
